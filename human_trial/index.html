<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Categorization Trial — Human Data</title>
<style>
  :root {
    --bg: #f7f4ee;
    --card: #ffffff;
    --text: #20242b;
    --muted: #6a7179;
    --border: #e3e6e4;
    --accent1: #3a6ea5;
    --accent2: #c1502e;
    --dark: #1b2430;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181f; --card: #1e232c; --text: #eef1f4; --muted: #9aa3ad; --border: #2c333c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181f; --card: #1e232c; --text: #eef1f4; --muted: #9aa3ad; --border: #2c333c;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 64px; }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 16px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  input[type=text], select {
    width: 100%; padding: 10px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 16px;
  }
  button {
    font-size: 16px; font-weight: 600; padding: 12px 20px; border-radius: 10px;
    border: none; cursor: pointer; background: var(--accent1); color: white;
  }
  button.secondary { background: transparent; color: var(--accent1); border: 1px solid var(--accent1); }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .stimWrap { display: flex; justify-content: center; margin: 20px 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--border); color: var(--muted); }
  a.link { color: var(--accent1); cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
var STIMULI = {"simple":[{"shape":"triangle","color":"blue","size":"large","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"blue","size":"medium","texture":"solid","transparency":"opaque","category":1},{"shape":"square","color":"red","size":"large","texture":"striped","transparency":"opaque","category":1},{"shape":"triangle","color":"green","size":"small","texture":"striped","transparency":"semi","category":2},{"shape":"triangle","color":"green","size":"large","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"large","texture":"dotted","transparency":"opaque","category":1},{"shape":"triangle","color":"red","size":"large","texture":"striped","transparency":"semi","category":2},{"shape":"triangle","color":"red","size":"small","texture":"solid","transparency":"opaque","category":2},{"shape":"triangle","color":"green","size":"small","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"red","size":"small","texture":"dotted","transparency":"semi","category":1},{"shape":"triangle","color":"green","size":"small","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"blue","size":"medium","texture":"dotted","transparency":"semi","category":1},{"shape":"triangle","color":"green","size":"large","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"red","size":"small","texture":"solid","transparency":"opaque","category":1},{"shape":"square","color":"green","size":"small","texture":"solid","transparency":"opaque","category":1},{"shape":"triangle","color":"green","size":"large","texture":"dotted","transparency":"semi","category":2},{"shape":"triangle","color":"blue","size":"medium","texture":"solid","transparency":"semi","category":2},{"shape":"square","color":"red","size":"small","texture":"solid","transparency":"semi","category":1},{"shape":"square","color":"yellow","size":"small","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"blue","size":"large","texture":"solid","transparency":"opaque","category":1},{"shape":"square","color":"red","size":"medium","texture":"striped","transparency":"semi","category":1},{"shape":"triangle","color":"yellow","size":"large","texture":"striped","transparency":"semi","category":2},{"shape":"triangle","color":"blue","size":"small","texture":"solid","transparency":"semi","category":2},{"shape":"triangle","color":"green","size":"large","texture":"striped","transparency":"semi","category":2},{"shape":"triangle","color":"yellow","size":"small","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"blue","size":"large","texture":"dotted","transparency":"opaque","category":1},{"shape":"square","color":"red","size":"small","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"red","size":"large","texture":"solid","transparency":"semi","category":1},{"shape":"square","color":"green","size":"medium","texture":"striped","transparency":"semi","category":1},{"shape":"triangle","color":"green","size":"small","texture":"dotted","transparency":"semi","category":2},{"shape":"triangle","color":"red","size":"small","texture":"striped","transparency":"semi","category":2},{"shape":"square","color":"green","size":"medium","texture":"striped","transparency":"opaque","category":1},{"shape":"square","color":"red","size":"large","texture":"striped","transparency":"opaque","category":1},{"shape":"triangle","color":"yellow","size":"medium","texture":"dotted","transparency":"semi","category":2},{"shape":"triangle","color":"green","size":"large","texture":"solid","transparency":"semi","category":2},{"shape":"square","color":"blue","size":"small","texture":"solid","transparency":"semi","category":1},{"shape":"triangle","color":"red","size":"large","texture":"dotted","transparency":"semi","category":2},{"shape":"square","color":"red","size":"large","texture":"solid","transparency":"semi","category":1},{"shape":"triangle","color":"blue","size":"large","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"medium","texture":"dotted","transparency":"semi","category":1}],"conjunctive":[{"shape":"square","color":"red","size":"medium","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"small","texture":"solid","transparency":"semi","category":1},{"shape":"square","color":"green","size":"medium","texture":"solid","transparency":"semi","category":1},{"shape":"square","color":"red","size":"small","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"small","texture":"solid","transparency":"semi","category":1},{"shape":"square","color":"green","size":"large","texture":"striped","transparency":"semi","category":1},{"shape":"square","color":"red","size":"small","texture":"dotted","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"small","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"red","size":"medium","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"small","texture":"solid","transparency":"semi","category":1},{"shape":"square","color":"green","size":"small","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"red","size":"small","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"red","size":"large","texture":"dotted","transparency":"opaque","category":2},{"shape":"square","color":"red","size":"large","texture":"dotted","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"medium","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"red","size":"large","texture":"dotted","transparency":"opaque","category":2},{"shape":"square","color":"red","size":"medium","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"large","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"red","size":"medium","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"medium","texture":"solid","transparency":"semi","category":1},{"shape":"square","color":"red","size":"medium","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"red","size":"small","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"small","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"red","size":"medium","texture":"dotted","transparency":"opaque","category":2},{"shape":"square","color":"red","size":"small","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"small","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"red","size":"small","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"large","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"green","size":"small","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"red","size":"medium","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"small","texture":"striped","transparency":"semi","category":1},{"shape":"square","color":"red","size":"medium","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"red","size":"small","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"red","size":"small","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"small","texture":"striped","transparency":"semi","category":1},{"shape":"square","color":"green","size":"medium","texture":"striped","transparency":"semi","category":1},{"shape":"square","color":"green","size":"medium","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"green","size":"medium","texture":"striped","transparency":"semi","category":1},{"shape":"square","color":"green","size":"medium","texture":"striped","transparency":"semi","category":1},{"shape":"square","color":"red","size":"medium","texture":"striped","transparency":"opaque","category":2}],"disjunctive":[{"shape":"square","color":"green","size":"large","texture":"dotted","transparency":"semi","category":1},{"shape":"square","color":"green","size":"large","texture":"solid","transparency":"semi","category":1},{"shape":"disc","color":"green","size":"medium","texture":"striped","transparency":"semi","category":2},{"shape":"disc","color":"red","size":"large","texture":"striped","transparency":"opaque","category":1},{"shape":"disc","color":"green","size":"small","texture":"solid","transparency":"semi","category":2},{"shape":"square","color":"yellow","size":"large","texture":"solid","transparency":"semi","category":2},{"shape":"disc","color":"green","size":"medium","texture":"striped","transparency":"semi","category":2},{"shape":"square","color":"green","size":"small","texture":"solid","transparency":"semi","category":1},{"shape":"disc","color":"green","size":"medium","texture":"dotted","transparency":"opaque","category":2},{"shape":"square","color":"yellow","size":"medium","texture":"solid","transparency":"semi","category":2},{"shape":"disc","color":"red","size":"large","texture":"solid","transparency":"opaque","category":1},{"shape":"disc","color":"red","size":"large","texture":"striped","transparency":"opaque","category":1},{"shape":"disc","color":"red","size":"large","texture":"dotted","transparency":"semi","category":1},{"shape":"disc","color":"red","size":"small","texture":"solid","transparency":"semi","category":1},{"shape":"disc","color":"red","size":"large","texture":"dotted","transparency":"opaque","category":1},{"shape":"disc","color":"red","size":"large","texture":"dotted","transparency":"opaque","category":1},{"shape":"square","color":"green","size":"small","texture":"solid","transparency":"semi","category":1},{"shape":"square","color":"green","size":"medium","texture":"dotted","transparency":"semi","category":1},{"shape":"disc","color":"green","size":"medium","texture":"striped","transparency":"opaque","category":2},{"shape":"disc","color":"green","size":"medium","texture":"solid","transparency":"opaque","category":2},{"shape":"disc","color":"red","size":"medium","texture":"solid","transparency":"semi","category":1},{"shape":"disc","color":"red","size":"small","texture":"solid","transparency":"opaque","category":1},{"shape":"disc","color":"green","size":"small","texture":"solid","transparency":"opaque","category":2},{"shape":"disc","color":"red","size":"small","texture":"striped","transparency":"opaque","category":1},{"shape":"square","color":"yellow","size":"large","texture":"striped","transparency":"semi","category":2},{"shape":"square","color":"yellow","size":"small","texture":"dotted","transparency":"semi","category":2},{"shape":"disc","color":"red","size":"small","texture":"solid","transparency":"semi","category":1},{"shape":"disc","color":"green","size":"small","texture":"solid","transparency":"opaque","category":2},{"shape":"disc","color":"green","size":"medium","texture":"striped","transparency":"semi","category":2},{"shape":"disc","color":"green","size":"large","texture":"solid","transparency":"semi","category":2},{"shape":"disc","color":"green","size":"large","texture":"solid","transparency":"semi","category":2},{"shape":"square","color":"yellow","size":"medium","texture":"solid","transparency":"opaque","category":2},{"shape":"square","color":"green","size":"large","texture":"striped","transparency":"semi","category":1},{"shape":"disc","color":"red","size":"large","texture":"striped","transparency":"opaque","category":1},{"shape":"disc","color":"red","size":"medium","texture":"dotted","transparency":"opaque","category":1},{"shape":"disc","color":"green","size":"medium","texture":"dotted","transparency":"opaque","category":2},{"shape":"disc","color":"green","size":"small","texture":"striped","transparency":"opaque","category":2},{"shape":"square","color":"yellow","size":"large","texture":"solid","transparency":"semi","category":2},{"shape":"square","color":"green","size":"small","texture":"striped","transparency":"semi","category":1},{"shape":"disc","color":"green","size":"large","texture":"striped","transparency":"opaque","category":2}]};

var SET_LABELS = {simple: "Simple", conjunctive: "Conjunctive", disjunctive: "Disjunctive"};
var COLORS = { red: '#d23c3c', green: '#3caa5a', blue: '#3c6ea5', yellow: '#dcbe32' };
var SIZES = { small: 46, medium: 70, large: 94 };
var patCounter = 0;

var state = { view: 'setup', set: 'simple', name: '', items: [], idx: 0, correct: 0, log: [], awaiting: false };
var db = null;

function darken(hex){
  var r = Math.max(0, parseInt(hex.slice(1,3),16) - 70);
  var g = Math.max(0, parseInt(hex.slice(3,5),16) - 70);
  var b = Math.max(0, parseInt(hex.slice(5,7),16) - 70);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function svgFor(attrs){
  patCounter++;
  var base = COLORS[attrs.color];
  var dark = darken(base);
  var half = SIZES[attrs.size] / 2;
  var cx = 80, cy = 80;
  var shapeTag, shapeAttrs;
  if (attrs.shape === 'square'){
    shapeTag = 'rect';
    shapeAttrs = 'x="' + (cx-half) + '" y="' + (cy-half) + '" width="' + (half*2) + '" height="' + (half*2) + '"';
  } else if (attrs.shape === 'disc'){
    shapeTag = 'circle';
    shapeAttrs = 'cx="' + cx + '" cy="' + cy + '" r="' + half + '"';
  } else {
    shapeTag = 'polygon';
    shapeAttrs = 'points="' + cx + ',' + (cy-half) + ' ' + (cx-half) + ',' + (cy+half) + ' ' + (cx+half) + ',' + (cy+half) + '"';
  }
  var opacity = attrs.transparency === 'semi' ? 0.55 : 1;
  var patId = 'pat' + patCounter;
  var defs = '', overlay = '';
  if (attrs.texture === 'striped'){
    defs = '<pattern id="' + patId + '" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="none"/><rect width="4" height="10" fill="' + dark + '"/></pattern>';
    overlay = '<' + shapeTag + ' ' + shapeAttrs + ' fill="url(#' + patId + ')"/>';
  } else if (attrs.texture === 'dotted'){
    defs = '<pattern id="' + patId + '" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="3" fill="' + dark + '"/></pattern>';
    overlay = '<' + shapeTag + ' ' + shapeAttrs + ' fill="url(#' + patId + ')"/>';
  }
  return '<svg viewBox="0 0 160 160" width="160" height="160"><defs>' + defs + '</defs><g opacity="' + opacity + '"><' + shapeTag + ' ' + shapeAttrs + ' fill="' + base + '"/>' + overlay + '</g></svg>';
}

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function render(){
  var app = document.getElementById('app');
  if (state.view === 'setup') app.innerHTML = renderSetup();
  else if (state.view === 'trial') app.innerHTML = renderTrial();
  else if (state.view === 'summary') app.innerHTML = renderSummary();
  else if (state.view === 'results') app.innerHTML = renderResultsLoading();
  wireEvents();
  if (state.view === 'results') loadResults();
}

function renderSetup(){
  return ''
    + '<div class="nav"><h1>Categorization Trial</h1><a class="link" id="goResults">View results &rarr;</a></div>'
    + '<p class="sub">Same task the AI models were trained on — guess the category, learn from feedback, no rule given.</p>'
    + '<div class="card">'
    + '<label for="nameInput">Your name (shown in shared results)</label>'
    + '<input type="text" id="nameInput" placeholder="e.g. Prince" value="' + esc(state.name) + '">'
    + '<label for="setSelect">Rule set</label>'
    + '<select id="setSelect">'
    + ['simple','conjunctive','disjunctive'].map(function(s){ return '<option value="' + s + '"' + (s===state.set?' selected':'') + '>' + SET_LABELS[s] + '</option>'; }).join('')
    + '</select>'
    + '<button id="startBtn">Start (40 trials)</button>'
    + '</div>';
}

function renderTrial(){
  var item = state.items[state.idx];
  return ''
    + '<div class="nav"><span class="pill">' + SET_LABELS[state.set] + '</span><span class="pill">Trial ' + (state.idx+1) + ' / ' + state.items.length + '</span></div>'
    + '<div class="stats">'
    + '<div class="stat"><div class="n">' + (state.idx===0 ? '–' : Math.round(100*state.correct/state.idx) + '%') + '</div><div class="l">Accuracy so far</div></div>'
    + '<div class="stat"><div class="n">' + state.correct + ' / ' + state.idx + '</div><div class="l">Correct</div></div>'
    + '</div>'
    + '<div class="card">'
    + '<div class="stimWrap">' + svgFor(item) + '</div>'
    + '<div class="row" style="justify-content:center;">'
    + '<button id="cat1Btn" ' + (state.awaiting ? '' : 'disabled') + '>Category 1</button>'
    + '<button id="cat2Btn" ' + (state.awaiting ? '' : 'disabled') + '>Category 2</button>'
    + '<button id="nextBtn" class="secondary" style="display:' + (state.awaiting ? 'none' : 'inline-block') + '">Next</button>'
    + '</div>'
    + '<p id="feedback" style="text-align:center; margin-top:16px; font-weight:600;"></p>'
    + '</div>';
}

function renderSummary(){
  var pct = Math.round(100 * state.correct / state.items.length);
  var reportText = (state.name || 'Anonymous') + ' — ' + SET_LABELS[state.set] + ': ' + pct + '% (' + state.correct + '/' + state.items.length + ')';
  return ''
    + '<div class="nav"><h1>Set complete</h1></div>'
    + '<div class="card" style="text-align:center;">'
    + '<div style="font-size:48px; font-weight:800;">' + pct + '%</div>'
    + '<p class="sub">' + state.correct + ' correct out of ' + state.items.length + ' — ' + SET_LABELS[state.set] + ' rule set</p>'
    + '<p id="saveStatus" class="sub">Saving to shared results…</p>'
    + '<div class="card" style="background:var(--bg); margin-top:16px;">'
    + '<p style="font-weight:700; margin:0 0 8px;">Please send this line to Prince, just in case:</p>'
    + '<p id="reportText" style="font-family:monospace; font-size:15px; background:var(--card); padding:12px; border-radius:8px; border:1px solid var(--border); word-break:break-word;">' + esc(reportText) + '</p>'
    + '<button id="copyBtn" class="secondary" style="margin-top:8px;">Copy</button>'
    + '</div>'
    + '<div class="row" style="justify-content:center; margin-top:16px;">'
    + '<button id="anotherBtn">Try another set</button>'
    + '<button id="viewResultsBtn" class="secondary">View all results</button>'
    + '</div>'
    + '</div>';
}

function renderResultsLoading(){
  return '<div class="nav"><h1>Results</h1><a class="link" id="backBtn">&larr; Back</a></div><div class="card"><p class="sub">Loading…</p></div>';
}

function renderResultsTable(rows){
  if (rows.length === 0) return '<div class="card"><p class="sub">No submissions yet.</p></div>';
  var bySet = {};
  rows.forEach(function(r){
    if (!bySet[r.set]) bySet[r.set] = [];
    bySet[r.set].push(r);
  });
  var html = '';
  ['simple','conjunctive','disjunctive'].forEach(function(setName){
    var group = bySet[setName];
    if (!group) return;
    var avg = Math.round(group.reduce(function(a,r){ return a + r.accuracy; }, 0) / group.length);
    html += '<div class="card">';
    html += '<h3 style="margin-top:0;">' + SET_LABELS[setName] + ' — average ' + avg + '% (' + group.length + ' submission' + (group.length>1?'s':'') + ')</h3>';
    html += '<table><tr><th>Name</th><th>Accuracy</th><th>Correct / Total</th></tr>';
    group.forEach(function(r){
      html += '<tr><td>' + esc(r.name || 'Anonymous') + '</td><td>' + r.accuracy + '%</td><td>' + r.correct + ' / ' + r.total + '</td></tr>';
    });
    html += '</table></div>';
  });
  return html;
}

function wireEvents(){
  var el;
  if (el = document.getElementById('goResults')) el.addEventListener('click', function(){ state.view = 'results'; render(); });
  if (el = document.getElementById('backBtn')) el.addEventListener('click', function(){ state.view = 'setup'; render(); });
  if (el = document.getElementById('startBtn')) el.addEventListener('click', function(){
    var name = document.getElementById('nameInput').value.trim();
    var setName = document.getElementById('setSelect').value;
    state.name = name;
    state.set = setName;
    state.items = STIMULI[setName];
    state.idx = 0;
    state.correct = 0;
    state.log = [];
    state.awaiting = true;
    state.view = 'trial';
    render();
  });
  if (el = document.getElementById('cat1Btn')) el.addEventListener('click', function(){ answer(1); });
  if (el = document.getElementById('cat2Btn')) el.addEventListener('click', function(){ answer(2); });
  if (el = document.getElementById('nextBtn')) el.addEventListener('click', function(){
    state.idx++;
    if (state.idx < state.items.length){
      state.awaiting = true;
      render();
    } else {
      state.view = 'summary';
      render();
      saveResult();
    }
  });
  if (el = document.getElementById('anotherBtn')) el.addEventListener('click', function(){ state.view = 'setup'; render(); });
  if (el = document.getElementById('viewResultsBtn')) el.addEventListener('click', function(){ state.view = 'results'; render(); });
  if (el = document.getElementById('copyBtn')) el.addEventListener('click', function(){
    var text = document.getElementById('reportText').textContent;
    navigator.clipboard.writeText(text).then(function(){
      el.textContent = 'Copied!';
      setTimeout(function(){ el.textContent = 'Copy'; }, 1500);
    }).catch(function(){});
  });
}

function answer(choice){
  if (!state.awaiting) return;
  state.awaiting = false;
  var item = state.items[state.idx];
  var correct = choice === item.category;
  if (correct) state.correct++;
  state.log.push({ trial: state.idx+1, shape: item.shape, color: item.color, size: item.size, texture: item.texture, transparency: item.transparency, guess: choice, actual: item.category, correct: correct });
  var fb = document.getElementById('feedback');
  fb.textContent = correct ? 'Correct — it was Category ' + item.category + '.' : 'Incorrect — it was actually Category ' + item.category + '.';
  fb.style.color = correct ? '#3a8a56' : '#c1502e';
  document.getElementById('cat1Btn').setAttribute('disabled','disabled');
  document.getElementById('cat2Btn').setAttribute('disabled','disabled');
  document.getElementById('nextBtn').style.display = 'inline-block';
}

async function saveResult(){
  var statusEl = document.getElementById('saveStatus');
  try {
    if (!db) db = await claude.use('db');
    if (!db){
      if (statusEl) statusEl.textContent = 'Could not save (storage unavailable) — your result: ' + Math.round(100*state.correct/state.items.length) + '%';
      return;
    }
    await db.collection('submissions').add({
      name: state.name || 'Anonymous',
      set: state.set,
      correct: state.correct,
      total: state.items.length,
      accuracy: Math.round(100 * state.correct / state.items.length),
      log: state.log,
      ts: Date.now()
    });
    if (statusEl) statusEl.textContent = 'Saved to shared results.';
  } catch (e) {
    if (statusEl) statusEl.textContent = 'Could not save (' + (e && e.message ? e.message : 'error') + ') — your result: ' + Math.round(100*state.correct/state.items.length) + '%';
  }
}

async function loadResults(){
  var app = document.getElementById('app');
  try {
    if (!db) db = await claude.use('db');
    if (!db){
      app.innerHTML = '<div class="nav"><h1>Results</h1><a class="link" id="backBtn">&larr; Back</a></div><div class="card"><p class="sub">Storage unavailable in this view.</p></div>';
      wireEvents();
      return;
    }
    var snap = await db.collection('submissions').get();
    var rows = snap.docs.map(function(d){ return d.data(); }).sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
    app.innerHTML = '<div class="nav"><h1>Results</h1><a class="link" id="backBtn">&larr; Back</a></div>' + renderResultsTable(rows);
    wireEvents();
  } catch (e) {
    app.innerHTML = '<div class="nav"><h1>Results</h1><a class="link" id="backBtn">&larr; Back</a></div><div class="card"><p class="sub">Could not load results.</p></div>';
    wireEvents();
  }
}

render();
</script>
</body>
</html>
